<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion - Mes Objectifs</title>
  <meta name="theme-color" content="#0f172a" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100 antialiased">
  <main class="mx-auto flex min-h-screen w-full max-w-6xl items-center justify-center px-4 py-5 sm:px-6 lg:px-8">
    <form method="POST" class="w-full max-w-sm border border-neutral-800 bg-neutral-900 p-5 shadow-2xl shadow-black/30">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

      <div class="mb-5">
        <p class="text-xs font-medium uppercase tracking-[0.22em] text-emerald-300">Objectifs</p>
        <h1 class="mt-2 text-2xl font-semibold text-white">Connexion</h1>
      </div>

      {% with messages = get_flashed_messages(category_filter=["error"]) %}
        {% if messages %}
          <p class="mb-4 border border-red-400/40 bg-red-400/10 px-3 py-2 text-sm text-red-200">{{ messages[0] }}</p>
        {% endif %}
      {% endwith %}

      <label for="password" class="text-sm font-medium text-neutral-300">Mot de passe</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        autofocus
        class="mt-2 w-full border border-neutral-700 bg-neutral-950 px-3 py-2.5 text-sm text-white outline-none transition placeholder:text-neutral-500 focus:border-emerald-400"
      />

      <button class="mt-4 w-full bg-emerald-400 px-3 py-2.5 text-sm font-semibold text-neutral-950 transition hover:bg-emerald-300">Entrer</button>
    </form>
  </main>
</body>
</html>
