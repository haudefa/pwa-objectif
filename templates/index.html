<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes Objectifs</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" />
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon.ico') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="csrf-token" content="{{ csrf_token() }}" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100 antialiased">
  <main class="mx-auto flex min-h-screen w-full max-w-6xl flex-col px-3 py-4 sm:px-6 sm:py-5 lg:px-8">
    <section id="objectifs" class="w-full">
      <header class="mb-5 flex flex-col gap-4 border-b border-neutral-800 pb-5 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-xs font-medium uppercase tracking-[0.22em] text-emerald-300">Tableau de bord</p>
          <h1 class="mt-2 text-3xl font-semibold text-white sm:text-4xl">Mes objectifs</h1>
        </div>

        <form method="POST" action="/logout">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <button class="border border-neutral-700 px-3 py-2 text-sm font-medium text-neutral-300 transition hover:border-red-300 hover:text-red-200">Déconnexion</button>
        </form>
      </header>

      <div id="dashboard" class="mb-4 grid grid-cols-2 gap-2 sm:gap-3 lg:grid-cols-5"></div>

      <section class="mb-4 border border-neutral-800 bg-neutral-900 p-3 sm:p-4">
        <div class="mb-3 flex items-center justify-between gap-3">
          <h2 class="text-sm font-semibold text-white">Évolution</h2>
          <span id="progression-resume" class="text-xs text-neutral-500"></span>
        </div>
        <div class="h-44 w-full sm:h-64">
          <canvas id="progression-chart" class="h-full w-full"></canvas>
        </div>
        <div id="progression-legend" class="mt-3 flex flex-wrap gap-2"></div>
      </section>

      <section class="mb-4 border border-neutral-800 bg-neutral-900 p-3 sm:p-4">
        <div class="mb-3 flex items-center justify-between gap-3">
          <h2 class="text-sm font-semibold text-white">À faire aujourd'hui</h2>
          <span id="today-focus-count" class="text-xs text-neutral-500"></span>
        </div>
        <div id="today-focus" class="grid gap-2"></div>
      </section>

      <!-- Ajout objectif -->
      <div class="mb-4 grid gap-2 border border-neutral-800 bg-neutral-900 p-3 md:grid-cols-[minmax(0,1fr)_160px_150px_150px_auto]">
        <input id="titre" type="text" placeholder="Nouvel objectif" class="min-w-0 border border-neutral-700 bg-neutral-950 px-3 py-2.5 text-sm text-white outline-none transition placeholder:text-neutral-500 focus:border-emerald-400" />
        <select id="categorie" class="border border-neutral-700 bg-neutral-950 px-3 py-2.5 text-sm text-white outline-none transition focus:border-emerald-400">
          <option value="Travail">Travail</option>
          <option value="Physique">Physique</option>
          <option value="Apprentissage">Apprentissage</option>
          <option value="Spirituelle">Spirituelle</option>
        </select>
        <input id="date-debut" type="date" title="Date de début" class="border border-neutral-700 bg-neutral-950 px-3 py-2.5 text-sm text-white outline-none transition focus:border-emerald-400" />
        <input id="date-fin" type="date" title="Date limite" class="border border-neutral-700 bg-neutral-950 px-3 py-2.5 text-sm text-white outline-none transition focus:border-emerald-400" />
        <button onclick="ajouterObjectif()" class="bg-emerald-400 px-4 py-2.5 text-sm font-semibold text-neutral-950 transition hover:bg-emerald-300">Ajouter</button>
      </div>

      <!-- Filtres -->
      <div class="mb-4 grid gap-2 text-sm md:grid-cols-[minmax(0,1fr)_160px_160px_160px_auto]">
        <input id="filtre-recherche" type="search" placeholder="Rechercher" class="min-w-0 border border-neutral-800 bg-neutral-900 px-3 py-2.5 text-white outline-none transition placeholder:text-neutral-500 focus:border-emerald-400" />
        <select id="filtre-priorite" class="border border-neutral-800 bg-neutral-900 px-3 py-2.5 text-white outline-none transition focus:border-emerald-400">
          <option value="toutes">Toutes priorités</option>
          <option value="haute">Haute</option>
          <option value="moyenne">Moyenne</option>
          <option value="basse">Basse</option>
        </select>
        <select id="filtre-etat" class="border border-neutral-800 bg-neutral-900 px-3 py-2.5 text-white outline-none transition focus:border-emerald-400">
          <option value="tous">Tous états</option>
          <option value="accompli">Accompli</option>
          <option value="bloqué">Bloqué</option>
          <option value="en attente">En attente</option>
        </select>
        <select id="tri-objectifs" class="border border-neutral-800 bg-neutral-900 px-3 py-2.5 text-white outline-none transition focus:border-emerald-400">
          <option value="recent">Plus récents</option>
          <option value="ancien">Plus anciens</option>
          <option value="progression">Progression</option>
        </select>
        <label class="flex items-center justify-between gap-3 border border-neutral-800 bg-neutral-900 px-3 py-2.5 text-neutral-300 md:justify-center">
          <span>Archives</span>
          <input id="filtre-archive" type="checkbox" class="h-4 w-4 accent-emerald-400" />
        </label>
      </div>

      <!-- Liste des objectifs -->
      <div id="liste" class="space-y-4"></div>
    </section>
  </main>

  <script type="module" src="{{ url_for('static', filename='app.js') }}?v=8"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js");
      });
    }
  </script>

</body>
</html>
